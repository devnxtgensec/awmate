name: AWMate Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: awmate-windows-release
  # A newer commit supersedes a run that is stuck waiting for a macOS runner.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Calculate next installer version
        id: version
        shell: bash
        run: |
          set -eo pipefail
          previous=$(curl -fsSL https://github.com/devnxtgensec/awmate/releases/latest/download/latest.yml | sed -nE "s/^version: ([0-9]+[.][0-9]+[.][0-9]+).*$/\1/p")
          [[ "$previous" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
          echo "version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3]+1))" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: version
    runs-on: windows-2025
    steps:
      - name: Check out AWMate main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup-bun

      - name: Build the AWMate runtime
        working-directory: packages/cli
        shell: pwsh
        env:
          OPENCODE_CHANNEL: dev
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
        run: bun run script/build.ts --single --skip-install

      - name: Build AWMate desktop
        working-directory: packages/desktop
        shell: pwsh
        env:
          AWMATE_BUILD: "1"
          OPENCODE_CHANNEL: dev
          OPENCODE_TARGET: windows-x64
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
        run: bun run build

      - name: Build installer and update metadata
        working-directory: packages/desktop
        shell: pwsh
        env:
          AWMATE_BUILD: "1"
          OPENCODE_CHANNEL: dev
          OPENCODE_TARGET: windows-x64
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          bun run pack
          $unpacked = Join-Path $env:RUNNER_TEMP 'awmate-unpacked'
          Copy-Item -LiteralPath '..\..\dist\desktop\app' -Destination $unpacked -Recurse -Force
          $env:OPENCODE_DESKTOP_APP = $unpacked
          bun run pack

          $packageDist = Join-Path (Get-Location) 'dist'
          $installer = Join-Path $packageDist 'awmate-desktop-win-x64.exe'
          $metadata = Join-Path $packageDist 'latest.yml'
          if (!(Test-Path -LiteralPath $installer)) { throw 'AWMate Windows installer was not created.' }
          if (!(Test-Path -LiteralPath $metadata)) { throw 'electron-builder did not create latest.yml.' }

          $manifest = Get-Content $metadata -Raw
          if ($manifest -notmatch ("(?m)^version: " + [regex]::Escape($env:OPENCODE_VERSION) + "\s*$") -or !$manifest.Contains("awmate-desktop-win-x64.exe")) { throw "Invalid updater metadata" }
          $release = Join-Path $env:RUNNER_TEMP 'awmate-release'
          New-Item -ItemType Directory -Path $release -Force | Out-Null
          Copy-Item -LiteralPath $installer -Destination $release
          Copy-Item -LiteralPath $metadata -Destination $release
          $blockmap = "$installer.blockmap"
          if (Test-Path -LiteralPath $blockmap) { Copy-Item -LiteralPath $blockmap -Destination $release }
          Compress-Archive -LiteralPath (Join-Path $release 'awmate-desktop-win-x64.exe') -DestinationPath (Join-Path $release 'awmate-desktop-win-x64.zip') -CompressionLevel Optimal

      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: awmate-windows-release
          path: ${{ runner.temp }}/awmate-release/*
          if-no-files-found: error
          retention-days: 7

  # Modified for AWMate: ship the macOS build from the same release. macos-14 and macos-13 are retired
  # images, so the job targets macos-15. The app is unsigned until an Apple Developer ID certificate is
  # configured, so the download page tells users how to open it once.
  build-macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cross-build both arches on the Intel runner. The macOS hosted fleet intermittently
          # cancels jobs with "The job was not acquired by Runner of type hosted even after
          # multiple attempts" (see awmate-release-retry.yml); staying on one Intel image keeps
          # the two desktop jobs on the same, currently less contested runner type.
          - runner: macos-15-intel
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out AWMate main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup-bun

      - name: Build the AWMate runtime
        working-directory: packages/cli
        env:
          OPENCODE_CHANNEL: dev
          OPENCODE_TARGET: darwin-${{ matrix.arch }}
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
        run: bun run script/build.ts --single --skip-install

      - name: Build AWMate desktop
        working-directory: packages/desktop
        env:
          AWMATE_BUILD: "1"
          OPENCODE_CHANNEL: dev
          OPENCODE_TARGET: darwin-${{ matrix.arch }}
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
        run: bun run build

      - name: Package the app
        working-directory: packages/desktop
        env:
          AWMATE_BUILD: "1"
          OPENCODE_CHANNEL: dev
          OPENCODE_TARGET: darwin-${{ matrix.arch }}
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
        run: bun run pack

      - name: Collect release files
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          app=$(ls -d packages/desktop/dist/mac*/*.app | head -n1)
          if [ -z "$app" ]; then echo "AWMate.app was not created." >&2; exit 1; fi

          cli="$app/Contents/Resources/opencode-cli"
          if [ ! -x "$cli" ]; then echo "Bundled CLI is missing or not executable: $cli" >&2; exit 1; fi
          if [ ! -s "$app/Contents/Resources/opencode-cli.version" ]; then echo "Bundled CLI version is empty." >&2; exit 1; fi

          plist="$app/Contents/Info.plist"
          if ! /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$plist" | grep -q awmate; then
            echo "The app bundle does not register the awmate URL scheme." >&2
            exit 1
          fi
          if [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" != "$OPENCODE_VERSION" ]; then
            echo "The app bundle version does not match $OPENCODE_VERSION." >&2
            exit 1
          fi

          release="$RUNNER_TEMP/awmate-release"
          mkdir -p "$release"
          # ditto keeps the bundle's symlinks, permissions and extended attributes; zip -r does not.
          ditto -c -k --sequesterRsrc --keepParent "$app" "$release/awmate-desktop-mac-$ARCH.zip"
          shasum -a 256 "$release/awmate-desktop-mac-$ARCH.zip" | awk '{print $1}' > "$release/awmate-desktop-mac-$ARCH.zip.sha256"
          if [ -f packages/desktop/dist/latest-mac.yml ]; then cp packages/desktop/dist/latest-mac.yml "$release/latest-mac.yml"; fi

      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: awmate-macos-${{ matrix.arch }}-release
          path: ${{ runner.temp }}/awmate-release/*
          if-no-files-found: error
          retention-days: 7

  # Modified for AWMate: ship the Linux desktop packages from the same release. Kali and other
  # Debian/Ubuntu users get AppImage, deb and rpm builds here.
  build-linux:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out AWMate main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup-bun

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot

      - name: Build the AWMate runtime
        working-directory: packages/cli
        env:
          OPENCODE_CHANNEL: dev
          OPENCODE_TARGET: linux-x64
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
        run: bun run script/build.ts --single --skip-install

      - name: Build AWMate desktop
        working-directory: packages/desktop
        env:
          AWMATE_BUILD: "1"
          OPENCODE_CHANNEL: dev
          OPENCODE_TARGET: linux-x64
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
        run: bun run build

      - name: Package the app
        working-directory: packages/desktop
        env:
          AWMATE_BUILD: "1"
          OPENCODE_CHANNEL: dev
          OPENCODE_TARGET: linux-x64
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
        run: bun run pack

      - name: Collect release files
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/awmate-release"
          mkdir -p "$release"
          shopt -s nullglob
          files=(packages/desktop/dist/awmate-desktop-linux-*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Linux packages were created." >&2
            ls -R packages/desktop/dist | head -40 >&2
            exit 1
          fi
          cp "${files[@]}" "$release/"
          if [ -f packages/desktop/dist/latest-linux.yml ]; then cp packages/desktop/dist/latest-linux.yml "$release/latest-linux.yml"; fi
          ls -l "$release"

      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: awmate-linux-release
          path: ${{ runner.temp }}/awmate-release/*
          if-no-files-found: error
          retention-days: 7

  # Modified for AWMate: publish the standalone CLI so `curl | bash` and the PowerShell installer work.
  # Only native targets build here: cross-compiling needs the target's native pty package, which bun
  # skips on a different host. The darwin targets build in build-cli-darwin below.
  build-cli:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: windows-x64
            asset: awmate-cli-windows-x64.exe
          - runner: ubuntu-24.04
            target: linux-x64
            asset: awmate-cli-linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            asset: awmate-cli-linux-arm64
          - runner: windows-11-arm
            target: windows-arm64
            asset: awmate-cli-windows-arm64.exe
          - runner: ubuntu-24.04
            target: linux-x64-baseline
            asset: awmate-cli-linux-x64-baseline
          - runner: windows-2025
            target: windows-x64-baseline
            asset: awmate-cli-windows-x64-baseline.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out AWMate main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup-bun

      - name: Build the CLI
        working-directory: packages/cli
        env:
          AWMATE_CLI_NAME: awmate
          AWMATE_CLI_TITLE: AWMate
          OPENCODE_CHANNEL: dev
          OPENCODE_TARGET: ${{ matrix.target }}
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
        run: bun run script/build.ts --single --skip-install

      - name: Collect the binary
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          dir="packages/cli/dist/cli-$TARGET/bin"
          if [ -f "$dir/opencode.exe" ]; then bin="$dir/opencode.exe"; else bin="$dir/opencode"; fi
          if [ ! -f "$bin" ]; then
            echo "CLI binary not found: $bin" >&2
            ls -R packages/cli/dist | head -40 >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/awmate-cli"
          cp "$bin" "$RUNNER_TEMP/awmate-cli/$ASSET"
          chmod +x "$RUNNER_TEMP/awmate-cli/$ASSET" || true
          ls -l "$RUNNER_TEMP/awmate-cli"

      - name: Upload the binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: awmate-cli-${{ matrix.target }}
          path: ${{ runner.temp }}/awmate-cli/*
          if-no-files-found: error
          retention-days: 7

  # Modified for AWMate: all three darwin CLI targets build in one job. Every macOS job is a separate
  # hosted-runner acquisition, and GitHub's macOS fleet intermittently cancels queued jobs with
  # "The job was not acquired by Runner of type hosted even after multiple attempts" (run
  # 44299283834 lost four macOS jobs this way before any step ran), so the release requests as few
  # macOS runners as possible. awmate-release-retry.yml re-runs such jobs automatically.
  build-cli-darwin:
    needs: version
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Check out AWMate main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup-bun

      - name: Build the CLI for all darwin targets
        working-directory: packages/cli
        env:
          AWMATE_CLI_NAME: awmate
          AWMATE_CLI_TITLE: AWMate
          OPENCODE_CHANNEL: dev
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-x64 darwin-x64-baseline; do
            echo "Building $target..."
            OPENCODE_TARGET="$target" bun run script/build.ts --single --skip-install
          done

      - name: Collect the binaries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/awmate-cli"
          for target in darwin-arm64 darwin-x64 darwin-x64-baseline; do
            dir="packages/cli/dist/cli-$target/bin"
            if [ -f "$dir/opencode.exe" ]; then bin="$dir/opencode.exe"; else bin="$dir/opencode"; fi
            if [ ! -f "$bin" ]; then
              echo "CLI binary not found for $target" >&2
              ls -R packages/cli/dist | head -40 >&2
              exit 1
            fi
            cp "$bin" "$RUNNER_TEMP/awmate-cli/awmate-cli-$target"
          done
          chmod +x "$RUNNER_TEMP/awmate-cli/"awmate-cli-* || true
          ls -l "$RUNNER_TEMP/awmate-cli"

      - name: Upload the binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: awmate-cli-darwin
          path: ${{ runner.temp }}/awmate-cli/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, build-windows]
    # The Windows release must never wait on a macOS runner.
    if: always() && needs.build-windows.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: awmate-windows-release
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.version.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          shopt -s nullglob
          gh release create "$TAG" release/*.exe release/*.zip release/*.sha256 release/latest.yml release/*.blockmap --title "AWMate $TAG" --generate-notes --latest --target "$TARGET_SHA"

  # Modified for AWMate: CLI binaries are attached once they exist, without holding up the release.
  attach-cli:
    needs: [version, publish, build-cli, build-cli-darwin]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download CLI binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: awmate-cli-*
          merge-multiple: true
          path: release

      - name: Attach CLI binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          shopt -s nullglob
          files=(release/awmate-cli-*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No CLI binaries were produced; nothing to attach."
            exit 0
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  # Modified for AWMate: macOS artifacts are attached once they exist, without holding up the release.
  attach-macos:
    needs: [version, publish, build-macos]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: awmate-macos-*-release
          merge-multiple: true
          path: release

      - name: Attach macOS artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find release -maxdepth 1 -type f \( -name '*.zip' -o -name '*.sha256' -o -name 'latest-mac.yml' \) -print0)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No macOS artifacts were produced; nothing to attach."
            exit 0
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  # Modified for AWMate: Linux desktop packages are attached once they exist.
  attach-linux:
    needs: [version, publish, build-linux]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: awmate-linux-release
          path: release

      - name: Attach Linux artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          shopt -s nullglob
          files=(release/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Linux artifacts were produced; nothing to attach."
            exit 0
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
