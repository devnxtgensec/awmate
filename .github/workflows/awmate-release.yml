name: AWMate Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: awmate-windows-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Calculate next installer version
        id: version
        shell: bash
        run: |
          set -eo pipefail
          previous=$(curl -fsSL https://github.com/devnxtgensec/awmate/releases/latest/download/latest.yml | sed -nE "s/^version: ([0-9]+[.][0-9]+[.][0-9]+).*$/\1/p")
          [[ "$previous" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
          echo "version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3]+1))" >> "$GITHUB_OUTPUT"
      - name: Check out AWMate main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup-bun

      - name: Build the AWMate runtime
        working-directory: packages/cli
        shell: pwsh
        env:
          OPENCODE_CHANNEL: dev
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
        run: bun run script/build.ts --single --skip-install

      - name: Build AWMate desktop
        working-directory: packages/desktop
        shell: pwsh
        env:
          AWMATE_BUILD: "1"
          OPENCODE_CHANNEL: dev
          OPENCODE_TARGET: windows-x64
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
        run: bun run build

      - name: Build installer and update metadata
        working-directory: packages/desktop
        shell: pwsh
        env:
          AWMATE_BUILD: "1"
          OPENCODE_CHANNEL: dev
          OPENCODE_TARGET: windows-x64
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun run pack
          $unpacked = Join-Path $env:RUNNER_TEMP 'awmate-unpacked'
          Copy-Item -LiteralPath '..\..\dist\desktop\app' -Destination $unpacked -Recurse -Force
          $env:OPENCODE_DESKTOP_APP = $unpacked
          bun run pack

          $packageDist = Join-Path (Get-Location) 'dist'
          $installer = Join-Path $packageDist 'awmate-desktop-win-x64.exe'
          $metadata = Join-Path $packageDist 'latest.yml'
          if (!(Test-Path -LiteralPath $installer)) { throw 'AWMate Windows installer was not created.' }
          if (!(Test-Path -LiteralPath $metadata)) { throw 'electron-builder did not create latest.yml.' }

          $manifest = Get-Content $metadata -Raw
          if ($manifest -notmatch ("(?m)^version: " + [regex]::Escape($env:OPENCODE_VERSION) + "\s*$") -or !$manifest.Contains("awmate-desktop-win-x64.exe")) { throw "Invalid updater metadata" }
          $release = Join-Path $env:RUNNER_TEMP 'awmate-release'
          New-Item -ItemType Directory -Path $release -Force | Out-Null
          Copy-Item -LiteralPath $installer -Destination $release
          Copy-Item -LiteralPath $metadata -Destination $release
          $blockmap = "$installer.blockmap"
          if (Test-Path -LiteralPath $blockmap) { Copy-Item -LiteralPath $blockmap -Destination $release }
          Compress-Archive -LiteralPath (Join-Path $release 'awmate-desktop-win-x64.exe') -DestinationPath (Join-Path $release 'awmate-desktop-win-x64.zip') -CompressionLevel Optimal

      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: awmate-windows-release
          path: ${{ runner.temp }}/awmate-release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: awmate-windows-release
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.build-windows.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          shopt -s nullglob
          gh release create "$TAG" release/*.exe release/*.zip release/latest.yml release/*.blockmap --title "AWMate $TAG" --generate-notes --latest --target "$TARGET_SHA"
