name: AWMate Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: awmate-windows-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Calculate next installer version
        id: version
        shell: bash
        run: |
          set -eo pipefail
          previous=$(curl -fsSL https://github.com/devnxtgensec/awmate/releases/latest/download/latest.yml | sed -nE "s/^version: ([0-9]+[.][0-9]+[.][0-9]+).*$/\1/p")
          [[ "$previous" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
          echo "version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3]+1))" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: version
    runs-on: windows-2025
    steps:
      - name: Check out AWMate main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup-bun

      - name: Build the AWMate runtime
        working-directory: packages/cli
        shell: pwsh
        env:
          OPENCODE_CHANNEL: dev
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
        run: bun run script/build.ts --single --skip-install

      - name: Build AWMate desktop
        working-directory: packages/desktop
        shell: pwsh
        env:
          AWMATE_BUILD: "1"
          OPENCODE_CHANNEL: dev
          OPENCODE_TARGET: windows-x64
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
        run: bun run build

      - name: Build installer and update metadata
        working-directory: packages/desktop
        shell: pwsh
        env:
          AWMATE_BUILD: "1"
          OPENCODE_CHANNEL: dev
          OPENCODE_TARGET: windows-x64
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          bun run pack
          $unpacked = Join-Path $env:RUNNER_TEMP 'awmate-unpacked'
          Copy-Item -LiteralPath '..\..\dist\desktop\app' -Destination $unpacked -Recurse -Force
          $env:OPENCODE_DESKTOP_APP = $unpacked
          bun run pack

          $packageDist = Join-Path (Get-Location) 'dist'
          $installer = Join-Path $packageDist 'awmate-desktop-win-x64.exe'
          $metadata = Join-Path $packageDist 'latest.yml'
          if (!(Test-Path -LiteralPath $installer)) { throw 'AWMate Windows installer was not created.' }
          if (!(Test-Path -LiteralPath $metadata)) { throw 'electron-builder did not create latest.yml.' }

          $manifest = Get-Content $metadata -Raw
          if ($manifest -notmatch ("(?m)^version: " + [regex]::Escape($env:OPENCODE_VERSION) + "\s*$") -or !$manifest.Contains("awmate-desktop-win-x64.exe")) { throw "Invalid updater metadata" }
          $release = Join-Path $env:RUNNER_TEMP 'awmate-release'
          New-Item -ItemType Directory -Path $release -Force | Out-Null
          Copy-Item -LiteralPath $installer -Destination $release
          Copy-Item -LiteralPath $metadata -Destination $release
          $blockmap = "$installer.blockmap"
          if (Test-Path -LiteralPath $blockmap) { Copy-Item -LiteralPath $blockmap -Destination $release }
          Compress-Archive -LiteralPath (Join-Path $release 'awmate-desktop-win-x64.exe') -DestinationPath (Join-Path $release 'awmate-desktop-win-x64.zip') -CompressionLevel Optimal

      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: awmate-windows-release
          path: ${{ runner.temp }}/awmate-release/*
          if-no-files-found: error
          retention-days: 7

  # Modified for AWMate: ship both macOS variants from the same release. The app is unsigned until an
  # Apple Developer ID certificate is configured, so the download page tells users how to open it once.
  build-macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon builds natively; Intel needs its own runner so bun installs the darwin-x64
          # node-pty prebuild instead of skipping it.
          - runner: macos-14
            target: darwin-arm64
            arch: arm64
          - runner: macos-13
            target: darwin-x64
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out AWMate main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup-bun

      - name: Build the AWMate runtime
        working-directory: packages/cli
        env:
          OPENCODE_CHANNEL: dev
          OPENCODE_TARGET: ${{ matrix.target }}
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
        run: bun run script/build.ts --single --skip-install

      - name: Build AWMate desktop
        working-directory: packages/desktop
        env:
          AWMATE_BUILD: "1"
          OPENCODE_CHANNEL: dev
          OPENCODE_TARGET: ${{ matrix.target }}
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
        run: bun run build

      - name: Package the app
        working-directory: packages/desktop
        env:
          AWMATE_BUILD: "1"
          OPENCODE_CHANNEL: dev
          OPENCODE_TARGET: ${{ matrix.target }}
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
        run: bun run pack

      - name: Collect release files
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          app=$(ls -d packages/desktop/dist/mac-*/*.app | head -n1)
          if [ -z "$app" ]; then echo "AWMate.app was not created." >&2; exit 1; fi

          cli="$app/Contents/Resources/opencode-cli"
          if [ ! -x "$cli" ]; then echo "Bundled CLI is missing or not executable: $cli" >&2; exit 1; fi
          if [ ! -s "$app/Contents/Resources/opencode-cli.version" ]; then echo "Bundled CLI version is empty." >&2; exit 1; fi

          plist="$app/Contents/Info.plist"
          if ! /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$plist" | grep -q awmate; then
            echo "The app bundle does not register the awmate URL scheme." >&2
            exit 1
          fi
          if [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" != "$OPENCODE_VERSION" ]; then
            echo "The app bundle version does not match $OPENCODE_VERSION." >&2
            exit 1
          fi

          release="$RUNNER_TEMP/awmate-release"
          mkdir -p "$release"
          # ditto keeps the bundle's symlinks, permissions and extended attributes; zip -r does not.
          ditto -c -k --sequesterRsrc --keepParent "$app" "$release/awmate-desktop-mac-$ARCH.zip"
          shasum -a 256 "$release/awmate-desktop-mac-$ARCH.zip" | awk '{print $1}' > "$release/awmate-desktop-mac-$ARCH.zip.sha256"

      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: awmate-macos-${{ matrix.arch }}-release
          path: ${{ runner.temp }}/awmate-release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, build-windows, build-macos]
    # A macOS failure must not block the Windows release.
    if: always() && needs.build-windows.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: awmate-windows-release
          path: release

      - name: Download macOS artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: awmate-macos-*-release
          merge-multiple: true
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.version.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          shopt -s nullglob
          gh release create "$TAG" release/*.exe release/*.zip release/*.sha256 release/latest.yml release/*.blockmap --title "AWMate $TAG" --generate-notes --latest --target "$TARGET_SHA"
